name: CI & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update (example: v2.1.8)'
        required: true
        type: string

# A release run must never be cancelled halfway through an upload, so only
# ordinary CI runs (PRs, pushes to main) cancel each other.
concurrency:
  group: ci-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ZIPLINE_BASE_URL: https://files.valencystudio.dpdns.org

jobs:
  js-lua-checks:
    name: JS/TS/Lua Checks (Type & Lint)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache bun modules
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Formatting
        run: |
          bun run format:prettier:check
          bun run format:stylua:check

      - name: Build plugin
        run: bun run build:plugin

      - name: Typecheck, lint and test
        run: |
          bun run typecheck
          bun run lint
          bun run test

      - name: Build app
        run: bun run build:app

      # selene compiles from source in minutes, so keep the binary around.
      - name: Cache Selene
        id: selene-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/selene
          key: selene-${{ runner.os }}-0.31.0

      - name: Install Selene
        if: steps.selene-cache.outputs.cache-hit != 'true'
        run: cargo install selene --version 0.31.0 --locked

      - name: Run Selene
        working-directory: plugin
        run: selene .

  rust-check:
    name: Rust Check & Lint
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - run: bun install --frozen-lockfile
      - run: bun run build:plugin
      - run: bun run rust:check
      - run: bun run rust:lint
      - run: bun run rust:test

  prepare-release:
    name: Prepare Release
    needs: [js-lua-checks, rust-check]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      RELEASE_TAG: ${{ steps.set_tag.outputs.RELEASE_TAG }}
      SHOULD_RELEASE: ${{ steps.check_tag.outputs.SHOULD_RELEASE }}

    steps:
      - uses: actions/checkout@v7

      - name: Resolve release tag
        id: set_tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          elif [[ "$REF" == refs/tags/v* ]]; then
            tag="$REF_NAME"
          else
            tag="v$(jq -r .version package.json)"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$tag' is not a valid semver tag (expected e.g. v2.1.8)."
            exit 1
          fi

          echo "RELEASE_TAG=$tag" >> "$GITHUB_OUTPUT"

      - name: Decide whether to (re)build the release
        id: check_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RELEASE_TAG: ${{ steps.set_tag.outputs.RELEASE_TAG }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1 &&
             [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            echo "Release $RELEASE_TAG already exists and this is a push to main. Skipping release build."
            echo "SHOULD_RELEASE=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "SHOULD_RELEASE=true" >> "$GITHUB_OUTPUT"

  create-release:
    name: Create GitHub Release
    needs: prepare-release
    if: needs.prepare-release.outputs.SHOULD_RELEASE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Create or Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare-release.outputs.RELEASE_TAG }}
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "ValencyStudio - Spoofer $TAG_NAME"
          else
            gh release create "$TAG_NAME" \
              --generate-notes \
              --title "ValencyStudio - Spoofer $TAG_NAME"
          fi

  build-and-release:
    name: Build & Release (${{ matrix.os }})
    needs: [prepare-release, create-release]
    if: needs.prepare-release.outputs.SHOULD_RELEASE == 'true'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90

    permissions:
      contents: write

    strategy:
      fail-fast: false
      # tauri-action rewrites latest.json from whatever is already on the
      # release. Parallel jobs would race that read-modify-write and one
      # platform's updater entry would be lost, so the builds stay serial.
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            os: windows
            bundles: nsis
            args: ''

          - platform: macos-latest
            os: macos
            # "app" is required for the macOS updater artifact (.app.tar.gz).
            # Without it the bundler skips updater bundling and only warns,
            # so latest.json ships with no darwin-* entries.
            bundles: app,dmg
            args: '--target universal-apple-darwin'

          - platform: ubuntu-22.04
            os: linux
            bundles: appimage
            args: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          os: ${{ matrix.os }}

      - name: Cache bun modules
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Normalize Tauri signing key
        shell: bash
        env:
          RAW_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          RAW_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const normalize = (value) => value.replace(/\r\n?/g, '\n').trim();

          const fail = (message) => {
            console.error(`::error::${message}`);
            process.exit(1);
          };

          const rawKey = normalize(process.env.RAW_TAURI_SIGNING_PRIVATE_KEY || '');
          if (!rawKey) {
            fail(
              'Missing GitHub secret TAURI_PRIVATE_KEY. Set it to the full Tauri updater private key.'
            );
          }

          // The secret is accepted either as the minisign key file itself or as
          // that file base64 encoded, which is what tauri expects as input.
          const isMinisignFile = rawKey.startsWith('untrusted comment:');
          const decodedKey = isMinisignFile
            ? rawKey
            : normalize(Buffer.from(rawKey, 'base64').toString('utf8'));

          const keyForTauri = isMinisignFile
            ? Buffer.from(`${decodedKey}\n`, 'utf8').toString('base64')
            : rawKey;

          const keyLines = decodedKey.split('\n').filter(Boolean);

          if (!keyLines[0]?.startsWith('untrusted comment:') || keyLines.length < 2) {
            fail(
              'TAURI_PRIVATE_KEY must be the full base64 private key generated by "tauri signer generate". A raw full key starting with the "untrusted comment:" line is also accepted.'
            );
          }

          if (!/secret key/i.test(keyLines[0]) || /public key/i.test(keyLines[0])) {
            fail(
              'TAURI_PRIVATE_KEY contains a public key. Use the generated private key instead.'
            );
          }

          if (!/^[A-Za-z0-9+/=]+$/.test(keyLines[1])) {
            fail(
              'TAURI_PRIVATE_KEY does not look like a valid Tauri/minisign private key.'
            );
          }

          const password =
            process.env.RAW_TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '';
          const nonce = `${Date.now()}_${Math.random().toString(36).slice(2)}`;

          fs.appendFileSync(
            process.env.GITHUB_ENV,
            [
              `TAURI_SIGNING_PRIVATE_KEY<<KEY_${nonce}`,
              keyForTauri,
              `KEY_${nonce}`,
              `TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<PASS_${nonce}`,
              password,
              `PASS_${nonce}`,
              '',
            ].join('\n')
          );
          NODE

      - name: Build app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles ${{ matrix.bundles }} ${{ matrix.args }}
          tagName: ${{ needs.prepare-release.outputs.RELEASE_TAG }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true

  verify-updater-release:
    name: Verify updater artifacts
    needs: [prepare-release, build-and-release]
    if: needs.prepare-release.outputs.SHOULD_RELEASE == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Verify release updater metadata and macOS signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare-release.outputs.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir updater-check

          gh release download "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir updater-check \
            --pattern latest.json

          gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME" \
            --jq '.assets' \
            > updater-check/assets.json

          node <<'NODE'
          const fs = require('node:fs');

          const latest = JSON.parse(
            fs.readFileSync('updater-check/latest.json', 'utf8')
          );
          const assets = JSON.parse(
            fs.readFileSync('updater-check/assets.json', 'utf8')
          );

          for (const suffix of ['.app.tar.gz', '.app.tar.gz.sig']) {
            if (!assets.some((asset) => asset.name.endsWith(suffix))) {
              throw new Error(`the release has no ${suffix} asset`);
            }
          }

          // tauri-action publishes GitHub API asset urls, which carry the asset
          // id instead of the filename, so resolve the id back to a name.
          // Any other host (S3, R2, ...) exposes the filename in the url itself.
          const assetNamesById = new Map(
            assets.map((asset) => [String(asset.id), asset.name])
          );

          const platforms = latest.platforms || {};

          for (const key of ['darwin-aarch64', 'darwin-x86_64']) {
            const value = platforms[key];
            if (!value) {
              throw new Error(`latest.json is missing required macOS updater target ${key}`);
            }
            if (typeof value.signature !== 'string' || value.signature.trim() === '') {
              throw new Error(`latest.json macOS entry ${key} has no updater signature`);
            }
            if (typeof value.url !== 'string' || value.url.trim() === '') {
              throw new Error(`latest.json macOS entry ${key} has no download url`);
            }

            const id = value.url.match(/\/releases\/assets\/(\d+)/)?.[1];
            const name =
              (id && assetNamesById.get(id)) ||
              decodeURIComponent(value.url.split('/').pop() || '');

            if (!name.endsWith('.app.tar.gz')) {
              throw new Error(
                `latest.json macOS entry ${key} points at ${name || value.url}, not an .app.tar.gz updater bundle`
              );
            }
          }
          NODE

  plugin-release:
    name: Build & Release Plugin
    needs: [prepare-release, create-release]
    if: needs.prepare-release.outputs.SHOULD_RELEASE == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Cache bun modules
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Build plugin
        run: bun run build:plugin

      - name: Upload plugin to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-release.outputs.RELEASE_TAG }}
          files: dist-plugin/ValencyStudioSpoofer.rbxmx
          fail_on_unmatched_files: true

  upload-zipline:
    name: Mirror Release to Zipline
    needs: [prepare-release, build-and-release, plugin-release]
    if: needs.prepare-release.outputs.SHOULD_RELEASE == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    permissions:
      contents: read

    outputs:
      downloads: ${{ steps.mirror.outputs.downloads }}

    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare-release.outputs.RELEASE_TAG }}
          ZIPLINE_TOKEN: ${{ secrets.ZIPLINE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${ZIPLINE_TOKEN:-}" ]; then
            echo "::error::Missing GitHub secret ZIPLINE_TOKEN. Add the Zipline authorization token as a repository secret."
            exit 1
          fi

          mkdir -p mirror
          gh release download "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir mirror
          ls -la mirror

      - name: Upload bundles under Latest names, falling back to versioned
        id: mirror
        env:
          ZIPLINE_TOKEN: ${{ secrets.ZIPLINE_TOKEN }}
          TAG_NAME: ${{ needs.prepare-release.outputs.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          UPLOAD_STATUS=""
          UPLOAD_BODY=""

          # Uploads one file, leaving the HTTP status in UPLOAD_STATUS and the
          # raw body in UPLOAD_BODY.
          #
          # The status matters: the site sits behind Cloudflare, which answers a
          # slow upload with an HTML error page instead of JSON. A body that is
          # not JSON is therefore expected rather than exceptional, so nothing
          # here throws and every failure stays diagnosable from the log alone.
          upload() {
            local file="$1" mime body_file status
            mime=$(file --mime-type -b "$file")
            body_file="$(mktemp)"

            # curl generates the multipart boundary itself; setting a
            # content-type header here would strip that boundary and make the
            # body unparseable on the server side.
            if status=$(curl -sS \
                --connect-timeout 15 \
                --max-time 300 \
                --retry 3 --retry-delay 5 --retry-all-errors \
                -o "$body_file" -w '%{http_code}' \
                -H "authorization: $ZIPLINE_TOKEN" \
                -H 'x-zipline-format: name' \
                -H 'x-zipline-original-name: true' \
                -F "file=@${file};type=${mime}" \
                "${ZIPLINE_BASE_URL}/api/upload"); then
              UPLOAD_STATUS="$status"
            else
              UPLOAD_STATUS="curl-failed:$?"
            fi

            UPLOAD_BODY="$(cat "$body_file")"
            rm -f "$body_file"
          }

          stored_url() {
            jq -r '.files[0].url // empty' <<<"$UPLOAD_BODY" 2>/dev/null || true
          }

          is_name_clash() {
            [ "$UPLOAD_STATUS" = "400" ] &&
              jq -e '(.error // "") | tostring | test("E1009")' \
                <<<"$UPLOAD_BODY" >/dev/null 2>&1
          }

          existing_url_for_name() {
            curl -fsSL -o /dev/null --connect-timeout 15 --max-time 60 \
              -w '%{url_effective}' \
              "${ZIPLINE_BASE_URL}/raw/$1" 2>/dev/null || true
          }

          version="${TAG_NAME#v}"
          uploaded=0
          downloads='{}'

          for f in mirror/*.exe mirror/*.dmg mirror/*.AppImage mirror/*.rbxmx; do
            base=$(basename "$f")

            versioned="$base"
            if [[ "$base" != *"$version"* ]]; then
              versioned="${base%.*}_${version}.${base##*.}"
            fi

            latest=$(printf '%s' "$versioned" |
              sed -E 's/_[0-9]+\.[0-9]+\.[0-9]+([._])/_Latest\1/')

            if [ "$latest" != "$base" ]; then
              mv "$f" "mirror/$latest"
              f="mirror/$latest"
            fi

            upload "$f"
            url="$(stored_url)"

            # A "Latest" name is written once; on the next release the same name
            # is refused, so fall back to the versioned name.
            if [ -z "$url" ] && is_name_clash && [ "$versioned" != "$(basename "$f")" ]; then
              echo "::notice::$latest was refused, so the versioned name is used instead."
              mv "$f" "mirror/$versioned"
              f="mirror/$versioned"
              upload "$f"
              url="$(stored_url)"
            fi

            # If even the versioned name is taken, the file is already on the
            # server: reuse whatever is already published under that name rather
            # than failing the whole run.
            if [ -z "$url" ] && is_name_clash; then
              echo "::notice::Zipline already has this file name; reusing the existing URL."
              for cand in "$latest" "$versioned"; do
                existing="$(existing_url_for_name "$cand")"
                if [ -n "$existing" ]; then
                  url="$existing"
                  break
                fi
              done
            fi

            if [ -z "$url" ]; then
              echo "::error::Upload of $f failed with HTTP $UPLOAD_STATUS"
              echo "::error::Response: ${UPLOAD_BODY:-<empty>}"
              echo "::error::Large bundles take over a minute to transfer, and the"
              echo "::error::site sits behind Cloudflare, so a timeout here usually"
              echo "::error::means the proxy gave up rather than the file being bad."
              exit 1
            fi

            url="${url/#http:\/\//https:\/\/}"

            case "$f" in
              *.exe)      key=windows ;;
              *.dmg)      key=macos ;;
              *.AppImage) key=linux ;;
              *.rbxmx)    key=plugin ;;
              *)          key="other-$uploaded" ;;
            esac

            if [ "$key" = "plugin" ]; then
              url="${url/\/u\//\/raw\/}"
            fi

            echo "$f -> $url"
            downloads=$(jq -c --arg k "$key" --arg v "$url" '. + {($k): $v}' <<<"$downloads")
            uploaded=$((uploaded + 1))
          done

          if [ "$uploaded" -eq 0 ]; then
            echo "::error::No bundles found to mirror."
            exit 1
          fi

          echo "Uploads this run: $downloads"
          echo "downloads=$downloads" >> "$GITHUB_OUTPUT"

  announce-release:
    name: Announce on Discord
    needs: [prepare-release, build-and-release, plugin-release, upload-zipline]
    if: needs.prepare-release.outputs.SHOULD_RELEASE == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Post to Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.RELEASE_TAG }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare-release.outputs.RELEASE_TAG }}
          ZIPLINE_DOWNLOADS: ${{ needs.upload-zipline.outputs.downloads }}

        run: |
          python3 <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          def require_env(name):
              value = os.environ.get(name, "").strip()
              if not value:
                  raise RuntimeError(f"Missing required environment variable {name}.")
              return value

          bot_token = require_env("DISCORD_BOT_TOKEN")
          channel_id = require_env("DISCORD_CHANNEL_ID")
          release_tag = require_env("RELEASE_TAG")

          github_token = os.environ.get("GITHUB_TOKEN", "").strip()
          repo = os.environ.get("GITHUB_REPOSITORY", "").strip()
          release_url = os.environ.get("RELEASE_URL", "").strip()
          raw_downloads = os.environ.get("ZIPLINE_DOWNLOADS", "").strip()
          base_url = os.environ.get(
              "ZIPLINE_BASE_URL", "https://files.valencystudio.dpdns.org"
          ).rstrip("/")

          ICON_URL = f"{base_url}/raw/c1PUm0.png"
          BANNER_URL = f"{base_url}/u/image.png"

          # The mirror job reports the URL each file actually landed on. Using
          # those instead of a hardcoded link is what keeps the announcement
          # honest: a "Latest" name is only written once, so a later release
          # falls back to a versioned name and the link follows it.
          try:
              downloads = json.loads(raw_downloads) if raw_downloads else {}
          except json.JSONDecodeError:
              downloads = {}

          def download_line(label, key):
              url = downloads.get(key)
              if not url:
                  return None
              return f"- **{label}** [Download]({url})"

          lines = [
              line
              for line in (
                  download_line("Windows", "windows"),
                  download_line("Mac", "macos"),
                  download_line("Linux", "linux"),
              )
              if line
          ]

          plugin_url = downloads.get("plugin")
          if plugin_url:
              lines.append("")
              lines.append(f"**Plugins Roblox** [Download Here]({plugin_url})")

          if not lines:
              raise RuntimeError(
                  "The mirror job reported no download URLs, so the announcement "
                  "would only contain dead links."
              )

          DOWNLOADS = "\n".join(lines)

          def github_api(path):
              request = urllib.request.Request(
                  f"https://api.github.com{path}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {github_token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "ValencyStudio-Spoofer-Release-Bot",
                  },
              )
              with urllib.request.urlopen(request, timeout=15) as response:
                  return json.loads(response.read().decode("utf-8"))

          release_record = {}
          if repo and github_token:
              try:
                  release_record = github_api(
                      f"/repos/{repo}/releases/tags/{release_tag}"
                  )
              except Exception as error:
                  print(f"::warning::Could not read the release record: {error}")

          release_notes = (release_record.get("body") or "").strip() or (
              "No release notes were provided for this version."
          )

          # The changelog is rendered inside a fenced code block; a fence in the
          # notes would end that block early and mangle the embed.
          release_notes = release_notes.replace("```", "~~~")

          def fit_embed_description(text, max_chars=3800):
              if len(text) <= max_chars:
                  return text

              suffix = f"\n\n[Read the full release notes]({release_url})"
              available = max_chars - len(suffix) - 1

              clipped = (
                  text[:available].rsplit("\n", 1)[0].rstrip()
                  or text[:available].rstrip()
              )
              return f"{clipped}…{suffix}"

          author = {"name": "GitHub", "url": release_url, "avatar": None}
          if repo and github_token:
              try:
                  commit = github_api(f"/repos/{repo}/commits/{release_tag}")
                  github_author = commit.get("author") or {}
                  commit_author = (commit.get("commit") or {}).get("author") or {}
                  author = {
                      "name": (
                          github_author.get("login")
                          or commit_author.get("name")
                          or "GitHub"
                      ),
                      "url": github_author.get("html_url") or release_url,
                      "avatar": github_author.get("avatar_url"),
                  }
              except Exception as error:
                  print(f"::warning::Could not resolve the release author: {error}")

          footer = {
              "text": (
                  f"Released by {author['name']} • "
                  "The auto-updater will prompt you on next launch."
              )
          }
          if author["avatar"]:
              footer["icon_url"] = author["avatar"]

          payload = {
              "content": (
                  f"@everyone **ValencyStudio - Spoofer {release_tag} has updated!**"
              ),
              "embeds": [
                  {
                      "title": "Downloads Available",
                      "description": DOWNLOADS,
                      "color": 4653311,
                      "author": {
                          "name": "ValencyStudio - Spoofer Updates",
                          "icon_url": ICON_URL,
                      },
                      "image": {"url": BANNER_URL},
                  },
                  {
                      "title": "CHANGELOGS",
                      "description": (
                          "```diff\n"
                          + fit_embed_description(release_notes)
                          + "\n```"
                      ),
                      "color": 1949277,
                      "footer": footer,
                  },
              ],
              "username": "ValencyStudio App",
              "avatar_url": ICON_URL,
              "allowed_mentions": {"parse": ["everyone"]},
          }

          request = urllib.request.Request(
              f"https://discord.com/api/v10/channels/{channel_id}/messages",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bot {bot_token}",
                  "User-Agent": "ValencyStudio-Spoofer-Discord-Release-Bot",
              },
              method="POST",
          )

          for attempt in range(1, 4):
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      print(f"Posted Discord release announcement for {release_tag}.")
                      break
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")
                  retryable = error.code == 429 or error.code >= 500
                  if retryable and attempt < 3:
                      wait = int(error.headers.get("Retry-After", "5") or 5)
                      print(
                          f"::warning::Discord returned {error.code}; retrying in {wait}s."
                      )
                      time.sleep(wait)
                      continue
                  raise RuntimeError(
                      f"Discord API failed with status {error.code}: {body}"
                  ) from error
              except urllib.error.URLError as error:
                  if attempt < 3:
                      print(f"::warning::Discord request failed ({error}); retrying.")
                      time.sleep(5)
                      continue
                  raise RuntimeError(f"Discord request failed: {error}") from error
          else:
              raise RuntimeError("Discord announcement was not posted.")
          PY