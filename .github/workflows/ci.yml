name: CI & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update (example: v2.1.8)'
        required: true
        type: string

concurrency:
  group: ci-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  js-lua-checks:
    name: JS/TS/Lua Checks (Type & Lint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache bun modules
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun run format:prettier:check
      - run: bun run format:stylua:check
      - run: bun run build:plugin
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build:app

      - name: Install Selene
        run: cargo install selene --version 0.31.0 --locked

      - name: Run Selene
        run: cd plugin && selene .

  rust-check:
    name: Rust Check & Lint
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - run: bun install --frozen-lockfile
      - run: bun run build:plugin
      - run: bun run rust:check
      - run: bun run rust:lint
      - run: bun run rust:test

  prepare-release:
    name: Prepare Release
    needs: [js-lua-checks, rust-check]
    if: >
      (github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    outputs:
      RELEASE_TAG: ${{ steps.set_tag.outputs.RELEASE_TAG }}
      SHOULD_RELEASE: ${{ steps.check_tag.outputs.SHOULD_RELEASE }}

    steps:
      - uses: actions/checkout@v7

      - name: Get tag from package.json or inputs
        id: set_tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "RELEASE_TAG=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(jq -r .version package.json)
            echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if release already exists
        id: check_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.set_tag.outputs.RELEASE_TAG }}"

          if gh release view "$TAG" > /dev/null 2>&1; then
            if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
              echo "Release $TAG already exists and this is a push to main. Skipping release build."
              echo "SHOULD_RELEASE=false" >> "$GITHUB_OUTPUT"
            else
              echo "SHOULD_RELEASE=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "SHOULD_RELEASE=true" >> "$GITHUB_OUTPUT"
          fi

  create-release:
    name: Create GitHub Release
    needs: prepare-release
    if: needs.prepare-release.outputs.SHOULD_RELEASE == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Create or Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare-release.outputs.RELEASE_TAG }}
        run: |
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "ValencyStudio - Spoofer $TAG_NAME"
          else
            gh release create "$TAG_NAME" \
              --generate-notes \
              --title "ValencyStudio - Spoofer $TAG_NAME"
          fi

  build-and-release:
    name: Build & Release (${{ matrix.os }})
    needs: [prepare-release, create-release]
    if: needs.prepare-release.outputs.SHOULD_RELEASE == 'true'
    runs-on: ${{ matrix.platform }}

    permissions:
      contents: write

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            os: windows
            bundles: nsis
            args: ''

          - platform: macos-latest
            os: macos
            # "app" is required for the macOS updater artifact (.app.tar.gz).
            # Without it the bundler skips updater bundling and only warns,
            # so latest.json ships with no darwin-* entries.
            bundles: app,dmg
            args: '--target universal-apple-darwin'

          - platform: ubuntu-22.04
            os: linux
            bundles: appimage
            args: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          os: ${{ matrix.os }}

      - name: Cache bun modules
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Normalize Tauri signing key
        shell: bash
        env:
          RAW_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          RAW_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const normalizeNewlines = (value) =>
            value.replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();

          const fail = (message) => {
            console.error(`::error::${message}`);
            process.exit(1);
          };

          const rawKey = normalizeNewlines(
            process.env.RAW_TAURI_SIGNING_PRIVATE_KEY || ''
          );

          if (!rawKey) {
            fail(
              'Missing GitHub secret TAURI_PRIVATE_KEY. Set it to the full Tauri updater private key.'
            );
          }

          const decodedKey = rawKey.startsWith('untrusted comment:')
            ? rawKey
            : normalizeNewlines(
                Buffer.from(rawKey, 'base64').toString('utf8')
              );

          const keyForTauri = rawKey.startsWith('untrusted comment:')
            ? Buffer.from(`${decodedKey}\n`, 'utf8').toString('base64')
            : rawKey;

          const keyLines = decodedKey.split('\n').filter(Boolean);

          if (
            !keyLines[0]?.startsWith('untrusted comment:') ||
            keyLines.length < 2
          ) {
            fail(
              'TAURI_PRIVATE_KEY must be the full base64 private key generated by "tauri signer generate". A raw full key with the first "untrusted comment:" line is also accepted.'
            );
          }

          if (
            !/secret key/i.test(keyLines[0]) ||
            /public key/i.test(keyLines[0])
          ) {
            fail(
              'TAURI_PRIVATE_KEY contains a public key. Use the generated private key instead.'
            );
          }

          if (!/^[A-Za-z0-9+/=]+$/.test(keyLines[1])) {
            fail(
              'TAURI_PRIVATE_KEY does not look like a valid Tauri/minisign private key.'
            );
          }

          const password =
            process.env.RAW_TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '';

          const keyDelimiter =
            `TAURI_SIGNING_KEY_${Date.now()}_${Math.random()
              .toString(36)
              .slice(2)}`;

          const passwordDelimiter =
            `TAURI_SIGNING_PASSWORD_${Date.now()}_${Math.random()
              .toString(36)
              .slice(2)}`;

          fs.appendFileSync(
            process.env.GITHUB_ENV,
            [
              `TAURI_SIGNING_PRIVATE_KEY<<${keyDelimiter}`,
              keyForTauri,
              keyDelimiter,
              `TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<${passwordDelimiter}`,
              password,
              passwordDelimiter,
              '',
            ].join('\n')
          );
          NODE

      - name: Build app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles ${{ matrix.bundles }} ${{ matrix.args }}
          tagName: ${{ needs.prepare-release.outputs.RELEASE_TAG }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true

  verify-updater-release:
    name: Verify updater artifacts
    needs: [prepare-release, build-and-release]
    if: needs.prepare-release.outputs.SHOULD_RELEASE == 'true'
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Verify release updater metadata and macOS signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare-release.outputs.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir updater-check

          gh release download "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir updater-check \
            --pattern latest.json

          gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME" \
            --jq '.assets[].name' \
            > updater-check/assets.txt

          gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME" \
            --jq '.assets' \
            > updater-check/assets.json

          grep -Eq '\.app\.tar\.gz$' updater-check/assets.txt
          grep -Eq '\.app\.tar\.gz\.sig$' updater-check/assets.txt

          node <<'NODE'
          const fs = require('node:fs');

          const latest = JSON.parse(
            fs.readFileSync('updater-check/latest.json', 'utf8')
          );
          const assets = JSON.parse(
            fs.readFileSync('updater-check/assets.json', 'utf8')
          );

          const assetNamesById = new Map(
            assets.map((asset) => [String(asset.id), asset.name])
          );

          const platforms = latest.platforms || {};

          for (const key of ['darwin-aarch64', 'darwin-x86_64']) {
            const value = platforms[key];
            if (!value) {
              throw new Error(`latest.json is missing required macOS updater target ${key}`);
            }
            if (typeof value.signature !== 'string' || value.signature.trim() === '') {
              throw new Error(`latest.json macOS entry ${key} has no updater signature`);
            }
            if (typeof value.url !== 'string' || value.url.trim() === '') {
              throw new Error(`latest.json macOS entry ${key} has no download url`);
            }

            // tauri-action publishes GitHub API asset urls, which carry the asset
            // id instead of the filename, so resolve the id back to a name.
            // Any other host (S3, R2, ...) exposes the filename in the url itself.
            const id = value.url.match(/\/releases\/assets\/(\d+)/)?.[1];
            const name =
              (id && assetNamesById.get(id)) ||
              decodeURIComponent(value.url.split('/').pop() || '');

            if (!name.endsWith('.app.tar.gz')) {
              throw new Error(
                `latest.json macOS entry ${key} points at ${name || value.url}, not an .app.tar.gz updater bundle`
              );
            }
          }
          NODE

  plugin-release:
    name: Build & Release Plugin
    needs: [prepare-release, create-release]
    if: needs.prepare-release.outputs.SHOULD_RELEASE == 'true'
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Cache bun modules
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Build plugin
        run: bun run build:plugin

      - name: Upload plugin to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-release.outputs.RELEASE_TAG }}
          files: dist-plugin/ValencyStudioSpoofer.rbxmx
          fail_on_unmatched_files: true

  upload-zipline:
    name: Mirror Release to Zipline
    needs: [prepare-release, build-and-release, plugin-release]
    if: needs.prepare-release.outputs.SHOULD_RELEASE == 'true'
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    outputs:
      downloads: ${{ steps.mirror.outputs.downloads }}

    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare-release.outputs.RELEASE_TAG }}
          ZIPLINE_TOKEN: ${{ secrets.ZIPLINE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${ZIPLINE_TOKEN:-}" ]; then
            echo "::error::Missing GitHub secret ZIPLINE_TOKEN. Add the Zipline authorization token as a repository secret."
            exit 1
          fi

          mkdir -p mirror
          gh release download "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir mirror
          ls -la mirror

      - name: Upload bundles under Latest names, falling back to versioned
        id: mirror
        env:
          ZIPLINE_TOKEN: ${{ secrets.ZIPLINE_TOKEN }}
          TAG_NAME: ${{ needs.prepare-release.outputs.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Uploads one file and prints the URL the server actually stored.
          #
          # Zipline refuses a name it already holds (E1009), and this instance
          # exposes neither a delete nor an overwrite route, so a "Latest" copy
          # can only be written once. The response body is returned rather than
          # discarded so the caller can tell a name clash from a real failure.
          upload() {
            local file="$1"
            local mime
            mime=$(file --mime-type -b "$file")
            curl -sS \
              -H "authorization: $ZIPLINE_TOKEN" \
              -H 'content-type: multipart/form-data' \
              -H "x-zipline-format: name" \
              -H "x-zipline-original-name: true" \
              -F "file=@${file};type=${mime}" \
              https://files.valencystudio.dpdns.org/api/upload
          }

          version="${TAG_NAME#v}"

          uploaded=0
          downloads='{}'

          for f in mirror/*.exe mirror/*.dmg mirror/*.AppImage mirror/*.rbxmx; do
            base=$(basename "$f")

            # Every file needs a versioned spelling to fall back to, so an
            # asset that ships without one (the plugin is named
            # "ValencyStudioSpoofer.rbxmx") gets the tag version grafted on.
            # Without this the fallback would retry the very name that was
            # just refused, and the job could never get past its first run.
            versioned="$base"
            if [[ "$base" != *"$version"* ]]; then
              versioned="${base%.*}_${version}.${base##*.}"
            fi

            # The version sits between underscores in a bundle
            # ("..._3.0.3_x64-setup.exe") but before the extension in a grafted
            # name ("..._3.0.3.rbxmx"), so both separators are covered.
            latest=$(printf '%s' "$versioned" |
              sed -E 's/_[0-9]+\.[0-9]+\.[0-9]+([._])/_Latest\1/')

            if [ "$latest" != "$base" ]; then
              mv "$f" "mirror/$latest"
              f="mirror/$latest"
            fi

            response=$(upload "$f")
            url=$(jq -r '.files[0].url // empty' <<<"$response")

            if [ -z "$url" ]; then
              echo "::notice::$latest was refused, so the versioned name is used instead."
              echo "::notice::$(jq -r '.error // "no reason given"' <<<"$response")"
              mv "$f" "mirror/$versioned"
              f="mirror/$versioned"
              response=$(upload "$f")
              url=$(jq -r '.files[0].url // empty' <<<"$response")
            fi

            if [ -z "$url" ]; then
              echo "::error::Upload failed for $f: $response"
              exit 1
            fi

            # Zipline echoes the origin it was reached on, which is plain http.
            # The site serves HTTPS, so the published link is upgraded rather
            # than sending people to an unencrypted download.
            url="${url/#http:\/\//https:\/\/}"

            echo "$f -> $url"
            case "$f" in
              *.exe)      key=windows ;;
              *.dmg)      key=macos ;;
              *.AppImage) key=linux ;;
              *.rbxmx)    key=plugin ;;
              *)          key="other-$uploaded" ;;
            esac
            downloads=$(jq -c --arg k "$key" --arg v "$url" '. + {($k): $v}' <<<"$downloads")
            uploaded=$((uploaded + 1))
          done

          if [ "$uploaded" -eq 0 ]; then
            echo "::error::No bundles found to mirror."
            exit 1
          fi

          echo "Uploads this run: $downloads"
          echo "downloads=$downloads" >> "$GITHUB_OUTPUT"

  announce-release:
    name: Announce on Discord
    needs: [prepare-release, build-and-release, plugin-release, upload-zipline]
    if: >-
      needs.prepare-release.outputs.SHOULD_RELEASE == 'true'
      && (
          github.ref == 'refs/heads/main'
          || startsWith(github.ref, 'refs/tags/v')
          || github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Post to Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.RELEASE_TAG }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare-release.outputs.RELEASE_TAG }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          ZIPLINE_DOWNLOADS: ${{ needs.upload-zipline.outputs.downloads }}

        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          bot_token = os.environ.get("DISCORD_BOT_TOKEN", "").strip()
          github_token = os.environ.get("GITHUB_TOKEN", "").strip()
          repo = os.environ.get("GITHUB_REPOSITORY", "").strip()
          release_tag = os.environ.get("RELEASE_TAG", "").strip()
          release_url = os.environ.get("RELEASE_URL", "").strip()
          channel_id = os.environ.get("DISCORD_CHANNEL_ID", "").strip()
          raw_downloads = os.environ.get("ZIPLINE_DOWNLOADS", "").strip()

          ICON_URL = "https://files.valencystudio.dpdns.org/raw/c1PUm0.png"
          BANNER_URL = "https://files.valencystudio.dpdns.org/u/image.png"

          # The mirror job reports the URL each file actually landed on. Using
          # those instead of a hardcoded link is what keeps the announcement
          # honest: a "Latest" name is only written once, so a later release
          # falls back to a versioned name and the link follows it.
          try:
              downloads = json.loads(raw_downloads) if raw_downloads else {}
          except json.JSONDecodeError:
              downloads = {}

          def download_line(label, key):
              url = downloads.get(key)
              if not url:
                  return None
              return f"- **{label}** [Download]({url})"

          lines = [
              line
              for line in (
                  download_line("Windows", "windows"),
                  download_line("Mac", "macos"),
                  download_line("Linux", "linux"),
              )
              if line
          ]
          plugin_url = downloads.get("plugin")
          if plugin_url:
              lines.append("")
              lines.append(f"**Plugins Roblox** [Download Here]({plugin_url})")

          if not lines:
              raise RuntimeError(
                  "The mirror job reported no download URLs, so the announcement "
                  "would only contain dead links."
              )

          DOWNLOADS = "\n".join(lines)

          release_record_cache = None

          if not bot_token:
              raise RuntimeError(
                  "Missing GitHub Actions secret DISCORD_BOT_TOKEN."
              )

          if not channel_id:
              raise RuntimeError(
                  "Missing GitHub Actions secret DISCORD_CHANNEL_ID."
              )

          if not release_tag:
              raise RuntimeError("Missing release tag.")

          def github_api(path):
              request = urllib.request.Request(
                  f"https://api.github.com{path}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {github_token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "ValencyStudio - Spoofer-Release-Bot",
                  },
              )

              with urllib.request.urlopen(request) as response:
                  return json.loads(response.read().decode("utf-8"))

          def get_release_by_tag():
              global release_record_cache

              if release_record_cache is not None:
                  return release_record_cache

              if not repo or not release_tag or not github_token:
                  return {}

              try:
                  release_record_cache = github_api(
                      f"/repos/{repo}/releases/tags/{release_tag}"
                  )
                  return release_record_cache
              except Exception:
                  return {}

          def read_release_notes():
              release = get_release_by_tag()
              release_body = (release.get("body") or "").strip()

              if release_body:
                  return release_body

              return "No release notes were provided for this version."

          def fit_embed_description(text):
              max_chars = 3800

              if len(text) <= max_chars:
                  return text

              suffix = f"\n\n[Read the full release notes]({release_url})"
              available = max_chars - len(suffix) - 1

              clipped = (
                  text[:available].rsplit("\n", 1)[0].rstrip()
                  or text[:available].rstrip()
              )

              return f"{clipped}…{suffix}"

          def get_commit_author():
              fallback = {
                  "name": "GitHub",
                  "url": release_url,
                  "avatar": None,
              }

              if not repo or not github_token:
                  return fallback

              try:
                  commit = github_api(
                      f"/repos/{repo}/commits/{release_tag}"
                  )
              except Exception:
                  return fallback

              github_author = commit.get("author") or {}
              commit_author = (commit.get("commit") or {}).get("author") or {}

              return {
                  "name": (
                      github_author.get("login")
                      or commit_author.get("name")
                      or "GitHub"
                  ),
                  "url": github_author.get("html_url") or release_url,
                  "avatar": github_author.get("avatar_url"),
              }

          release_notes = read_release_notes()
          author = get_commit_author()

          changelog_block = "```diff\n" + fit_embed_description(release_notes) + "\n```"

          payload = {
              "content": f"@everyone **ValencyStudio - Spoofer {release_tag} has updated!**",
              "embeds": [
                  {
                      "title": "Downloads Available",
                      "description": DOWNLOADS,
                      "color": 4653311,
                      "author": {
                          "name": "ValencyStudio - Spoofer Updates",
                          "icon_url": ICON_URL,
                      },
                      "image": {
                          "url": BANNER_URL,
                      },
                  },
                  {
                      "title": "CHANGELOGS",
                      "description": changelog_block,
                      "color": 1949277,
                      "footer": {
                          "text": (
                              f"Released by {author['name']} • "
                              "The auto-updater will prompt you on next launch."
                          ),
                          "icon_url": author["avatar"] if author["avatar"] else None,
                      },
                  },
              ],
              "username": "ValencyStudio App",
              "avatar_url": ICON_URL,
              "allowed_mentions": {
                  "parse": ["everyone"],
              },
              "attachments": [],
          }

          request = urllib.request.Request(
              f"https://discord.com/api/v10/channels/{channel_id}/messages",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bot {bot_token}",
                  "User-Agent": "ValencyStudio - Spoofer-Discord-Release-Bot",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(request) as response:
                  if response.status >= 300:
                      raise RuntimeError(
                          f"Discord API failed with status {response.status}"
                      )
          except urllib.error.HTTPError as error:
              body = error.read().decode("utf-8", errors="replace")
              raise RuntimeError(
                  f"Discord API failed with status {error.code}: {body}"
              ) from error

          print(
              f"Posted Discord release announcement for {release_tag}."
          )
          PY
