name: CI & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update (example: v2.1.8)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Keep only if your Actions runtime actually requires this opt-in.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ZIPLINE_BASE_URL: https://files.valencystudio.dpdns.org

jobs:
  js-lua-checks:
    name: JS/TS/Lua checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Prettier formatting
        run: bun run format:prettier:check

      - name: Check StyLua formatting
        run: bun run format:stylua:check

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Setup Rust for Selene
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Selene
        id: cache-selene
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/selene
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/.crates2.json
          key: selene-${{ runner.os }}-0.31.0

      - name: Install Selene
        if: steps.cache-selene.outputs.cache-hit != 'true'
        run: cargo install selene --version 0.31.0 --locked

      - name: Add Cargo bin to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Lint Lua with Selene
        working-directory: plugin
        run: selene .

      - name: Build plugin
        run: bun run build:plugin

      - name: Build app
        run: bun run build:app

  rust-check:
    name: Rust check & lint
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build plugin
        run: bun run build:plugin

      - name: Rust check
        run: bun run rust:check

      - name: Rust lint
        run: bun run rust:lint

      - name: Rust test
        run: bun run rust:test

  prepare-release:
    name: Prepare release
    needs: [js-lua-checks, rust-check]
    if: >
      (github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      releaseTag: ${{ steps.resolve.outputs.releaseTag }}
      shouldRelease: ${{ steps.exists.outputs.shouldRelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          tag=""

          case "$EVENT_NAME" in
            workflow_dispatch)
              tag="$INPUT_TAG"
              ;;
            push)
              if [[ "$REF" == refs/tags/v* ]]; then
                tag="$REF_NAME"
              else
                version="$(jq -r '.version // empty' package.json)"
                if [ -z "$version" ]; then
                  echo "::error::package.json does not contain a version."
                  exit 1
                fi
                tag="v$version"
              fi
              ;;
          esac

          re='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?([+][0-9A-Za-z.-]+)?$'
          if ! [[ "$tag" =~ $re ]]; then
            echo "::error::Invalid release tag '$tag'. Expected semantic version like v1.2.3 or v1.2.3-beta.1."
            exit 1
          fi

          echo "releaseTag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check whether release should run
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.releaseTag }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
              echo "Release $TAG already exists; skipping automatic main release."
              echo "shouldRelease=false" >> "$GITHUB_OUTPUT"
            else
              echo "shouldRelease=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "shouldRelease=true" >> "$GITHUB_OUTPUT"
          fi

  create-release:
    name: Create or update GitHub release
    needs: prepare-release
    if: needs.prepare-release.outputs.shouldRelease == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Upsert release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.releaseTag }}
        run: |
          set -euo pipefail

          title="ValencyStudio - Spoofer ${TAG}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$title"
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --generate-notes
          fi

  build-and-release:
    name: Build & release (${{ matrix.os }})
    needs: [prepare-release, create-release]
    if: needs.prepare-release.outputs.shouldRelease == 'true'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90

    permissions:
      contents: write

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            os: windows
            bundles: nsis
            args: ''

          - platform: macos-latest
            os: macos
            # "app" is required for the macOS updater artifact (.app.tar.gz).
            # Without it the bundler skips updater bundling and only warns,
            # so latest.json ships with no darwin-* entries.
            bundles: app,dmg
            args: '--target universal-apple-darwin'

          - platform: ubuntu-22.04
            os: linux
            bundles: appimage
            args: ''

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.releaseTag }}
          submodules: recursive
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          os: ${{ matrix.os }}

      - name: Cache Bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Normalize Tauri signing key
        env:
          RAW_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          RAW_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const normalizeNewlines = (value) =>
            value.replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();

          const fail = (message) => {
            console.error(`::error::${message}`);
            process.exit(1);
          };

          const rawKey = normalizeNewlines(
            process.env.RAW_TAURI_SIGNING_PRIVATE_KEY || ''
          );

          if (!rawKey) {
            fail(
              'Missing GitHub secret TAURI_PRIVATE_KEY. Set it to the full Tauri updater private key.'
            );
          }

          const decodedKey = rawKey.startsWith('untrusted comment:')
            ? rawKey
            : normalizeNewlines(
                Buffer.from(rawKey, 'base64').toString('utf8')
              );

          const keyForTauri = rawKey.startsWith('untrusted comment:')
            ? Buffer.from(`${decodedKey}\n`, 'utf8').toString('base64')
            : rawKey;

          const keyLines = decodedKey.split('\n').filter(Boolean);

          if (
            !keyLines[0]?.startsWith('untrusted comment:') ||
            keyLines.length < 2
          ) {
            fail(
              'TAURI_PRIVATE_KEY must be the full base64 private key generated by "tauri signer generate". A raw full key with the first "untrusted comment:" line is also accepted.'
            );
          }

          if (
            !/secret key/i.test(keyLines[0]) ||
            /public key/i.test(keyLines[0])
          ) {
            fail(
              'TAURI_PRIVATE_KEY contains a public key. Use the generated private key instead.'
            );
          }

          if (!/^[A-Za-z0-9+/=]+$/.test(keyLines[1])) {
            fail(
              'TAURI_PRIVATE_KEY does not look like a valid Tauri/minisign private key.'
            );
          }

          const password = normalizeNewlines(
            process.env.RAW_TAURI_SIGNING_PRIVATE_KEY_PASSWORD || ''
          );

          const keyDelimiter =
            `TAURI_SIGNING_KEY_${Date.now()}_${Math.random()
              .toString(36)
              .slice(2)}`;

          const passwordDelimiter =
            `TAURI_SIGNING_PASSWORD_${Date.now()}_${Math.random()
              .toString(36)
              .slice(2)}`;

          fs.appendFileSync(
            process.env.GITHUB_ENV,
            [
              `TAURI_SIGNING_PRIVATE_KEY<<${keyDelimiter}`,
              keyForTauri,
              keyDelimiter,
              `TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<${passwordDelimiter}`,
              password,
              passwordDelimiter,
              '',
            ].join('\n')
          );
          NODE

      - name: Build app and upload release artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.prepare-release.outputs.releaseTag }}
          releaseName: ValencyStudio - Spoofer ${{ needs.prepare-release.outputs.releaseTag }}
          args: --bundles ${{ matrix.bundles }} ${{ matrix.args }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true

  verify-updater-release:
    name: Verify updater artifacts
    needs: [prepare-release, build-and-release]
    if: needs.prepare-release.outputs.shouldRelease == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Verify release updater metadata and macOS signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.releaseTag }}
        run: |
          set -euo pipefail

          dir="$(mktemp -d)"

          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$dir" \
            --pattern latest.json

          gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '.assets[].name' \
            > "$dir/assets.txt"

          gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '.assets' \
            > "$dir/assets.json"

          grep -Eq '\.app\.tar\.gz$' "$dir/assets.txt"
          grep -Eq '\.app\.tar\.gz\.sig$' "$dir/assets.txt"

          export UPDATER_DIR="$dir"

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const dir = process.env.UPDATER_DIR;

          const latest = JSON.parse(
            fs.readFileSync(path.join(dir, 'latest.json'), 'utf8')
          );
          const assets = JSON.parse(
            fs.readFileSync(path.join(dir, 'assets.json'), 'utf8')
          );

          const assetNamesById = new Map(
            assets.map((asset) => [String(asset.id), asset.name])
          );

          const platforms = latest.platforms || {};

          for (const key of ['darwin-aarch64', 'darwin-x86_64']) {
            const value = platforms[key];
            if (!value) {
              throw new Error(`latest.json is missing required macOS updater target ${key}`);
            }
            if (typeof value.signature !== 'string' || value.signature.trim() === '') {
              throw new Error(`latest.json macOS entry ${key} has no updater signature`);
            }
            if (typeof value.url !== 'string' || value.url.trim() === '') {
              throw new Error(`latest.json macOS entry ${key} has no download url`);
            }

            // tauri-action publishes GitHub API asset urls, which carry the asset
            // id instead of the filename, so resolve the id back to a name.
            // Any other host (S3, R2, ...) exposes the filename in the url itself.
            const id = value.url.match(/\/releases\/assets\/(\d+)/)?.[1];
            const name =
              (id && assetNamesById.get(id)) ||
              decodeURIComponent(value.url.split('/').pop() || '');

            if (!name.endsWith('.app.tar.gz')) {
              throw new Error(
                `latest.json macOS entry ${key} points at ${name || value.url}, not an .app.tar.gz updater bundle`
              );
            }
          }

          console.log('Updater metadata verification passed.');
          NODE

  plugin-release:
    name: Build & release plugin
    needs: [prepare-release, create-release]
    if: needs.prepare-release.outputs.shouldRelease == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.releaseTag }}
          submodules: recursive

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Cache Bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build plugin
        run: bun run build:plugin

      - name: Upload plugin to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-release.outputs.releaseTag }}
          files: dist-plugin/ValencyStudioSpoofer.rbxmx
          fail_on_unmatched_files: true
          overwrite_files: true
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-zipline:
    name: Mirror release to Zipline
    needs: [prepare-release, build-and-release, plugin-release]
    if: needs.prepare-release.outputs.shouldRelease == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    permissions:
      contents: read

    outputs:
      downloads: ${{ steps.mirror.outputs.downloads }}

    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare-release.outputs.releaseTag }}
          ZIPLINE_TOKEN: ${{ secrets.ZIPLINE_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${ZIPLINE_TOKEN:-}" ]; then
            echo "::error::Missing GitHub secret ZIPLINE_TOKEN. Add the Zipline authorization token as a repository secret."
            exit 1
          fi

          mkdir -p mirror
          gh release download "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir mirror

          ls -la mirror

      - name: Upload bundles under Latest names, falling back to versioned
        id: mirror
        env:
          ZIPLINE_TOKEN: ${{ secrets.ZIPLINE_TOKEN }}
          TAG_NAME: ${{ needs.prepare-release.outputs.releaseTag }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          BASE_URL="${ZIPLINE_BASE_URL%/}"
          UPLOAD_URL="$BASE_URL/api/upload"
          RAW_URL="$BASE_URL/raw"

          # Uploads one file, leaving the HTTP status and the raw body in
          # UPLOAD_STATUS and UPLOAD_BODY.
          #
          # The status matters: the site sits behind Cloudflare, which answers
          # a slow upload with an HTML error page instead of JSON. A body that
          # is not JSON is therefore expected, not exceptional, so nothing here
          # throws and every failure stays diagnosable from the log alone.
          UPLOAD_STATUS=""
          UPLOAD_BODY=""

          upload() {
            local file="$1"
            local mime
            mime=$(file --mime-type -b "$file")

            local body_file
            body_file="$(mktemp)"

            local status
            if status=$(curl -sS --max-time 900 --retry 3 --retry-delay 10 \
              -o "$body_file" -w '%{http_code}' \
              -H "authorization: $ZIPLINE_TOKEN" \
              -H "x-zipline-format: name" \
              -H "x-zipline-original-name: true" \
              -F "file=@${file};type=${mime}" \
              "$UPLOAD_URL"); then
              UPLOAD_STATUS="$status"
            else
              UPLOAD_STATUS="curl-failed:$?"
            fi

            UPLOAD_BODY="$(cat "$body_file")"
            rm -f "$body_file"
          }

          stored_url() {
            jq -r '.files[0].url // .url // empty' <<<"$UPLOAD_BODY" 2>/dev/null || true
          }

          is_name_clash() {
            [[ "$UPLOAD_STATUS" == "400" || "$UPLOAD_STATUS" == "409" ]] &&
              jq -e '((.error.message // .error) | tostring) | test("E1009")' \
                <<<"$UPLOAD_BODY" >/dev/null 2>&1
          }

          existing_url_for_name() {
            local name="$1"
            local encoded
            encoded=$(jq -rn --arg v "$name" '$v|@uri')

            curl -fsSL --max-time 60 -o /dev/null -w '%{url_effective}' \
              "$RAW_URL/$encoded" 2>/dev/null || true
          }

          version="${TAG_NAME#v}"
          uploaded=0
          downloads='{}'

          for f in mirror/*.exe mirror/*.dmg mirror/*.AppImage mirror/*.rbxmx; do
            base=$(basename "$f")

            versioned="$base"
            if [[ "$base" != *"$version"* ]]; then
              versioned="${base%.*}_${version}.${base##*.}"
            fi

            latest=$(printf '%s' "$versioned" |
              sed -E 's/_[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?([._])/_Latest\2/')

            if [ "$latest" != "$base" ]; then
              mv "$f" "mirror/$latest"
              f="mirror/$latest"
            fi

            upload "$f"
            url="$(stored_url)"

            if [ -z "$url" ] && is_name_clash && [ "$latest" != "$versioned" ]; then
              echo "::notice::$latest was refused, so the versioned name is used instead."
              mv "$f" "mirror/$versioned"
              f="mirror/$versioned"
              upload "$f"
              url="$(stored_url)"
            fi

            # If the file name still clashes, assume Zipline already stores it
            # and reuse the existing public URL instead of failing the release.
            if [ -z "$url" ] && is_name_clash; then
              echo "::notice::Zipline already has this file name; reusing the existing URL."
              for cand in "$latest" "$versioned" "$(basename "$f")"; do
                existing="$(existing_url_for_name "$cand")"
                if [ -n "$existing" ]; then
                  url="$existing"
                  break
                fi
              done
            fi

            if [ -z "$url" ]; then
              echo "::error::Upload of $f failed with HTTP $UPLOAD_STATUS"
              echo "::error::Response: ${UPLOAD_BODY:-<empty>}"
              echo "::error::Large bundles take over a minute to transfer, and the"
              echo "::error::site sits behind Cloudflare, so a timeout here usually"
              echo "::error::means the proxy gave up rather than the file being bad."
              exit 1
            fi

            url="${url/#http:\/\//https:\/\/}"

            case "$f" in
              *.exe)      key=windows ;;
              *.dmg)      key=macos ;;
              *.AppImage) key=linux ;;
              *.rbxmx)    key=plugin ;;
              *)          key="other-$uploaded" ;;
            esac

            if [ "$key" = "plugin" ]; then
              url="${url/\/u\//\/raw\/}"
            fi

            echo "$f -> $url"
            downloads=$(jq -c --arg k "$key" --arg v "$url" '. + {($k): $v}' <<<"$downloads")
            uploaded=$((uploaded + 1))
          done

          if [ "$uploaded" -eq 0 ]; then
            echo "::error::No bundles found to mirror."
            exit 1
          fi

          echo "Uploads this run: $downloads"
          echo "downloads=$downloads" >> "$GITHUB_OUTPUT"

          {
            echo "### Zipline mirrors"
            echo '```json'
            echo "$downloads"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  announce-release:
    name: Announce on Discord
    needs: [prepare-release, build-and-release, plugin-release, upload-zipline]
    if: needs.prepare-release.outputs.shouldRelease == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Post to Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_MENTION: ${{ secrets.DISCORD_MENTION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.releaseTag }}
          ZIPLINE_DOWNLOADS: ${{ needs.upload-zipline.outputs.downloads }}
        run: |
          python3 <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          def get_env(name, default=""):
              return os.environ.get(name, default).strip()

          def fail(message):
              print(f"::error::{message}", file=sys.stderr)
              sys.exit(1)

          bot_token = get_env("DISCORD_BOT_TOKEN")
          channel_id = get_env("DISCORD_CHANNEL_ID")
          github_token = get_env("GITHUB_TOKEN")
          repo = get_env("GITHUB_REPOSITORY")
          release_tag = get_env("RELEASE_TAG")
          mention = get_env("DISCORD_MENTION", "@everyone")
          raw_downloads = get_env("ZIPLINE_DOWNLOADS")

          ICON_URL = "https://files.valencystudio.dpdns.org/raw/c1PUm0.png"
          BANNER_URL = "https://files.valencystudio.dpdns.org/u/image.png"

          if not bot_token:
              fail("Missing GitHub Actions secret DISCORD_BOT_TOKEN.")

          if not channel_id:
              fail("Missing GitHub Actions secret DISCORD_CHANNEL_ID.")

          if not release_tag:
              fail("Missing release tag.")

          release_url = (
              f"https://github.com/{repo}/releases/tag/{release_tag}"
              if repo
              else get_env("RELEASE_URL")
          )

          try:
              downloads = json.loads(raw_downloads) if raw_downloads else {}
          except json.JSONDecodeError:
              downloads = {}

          def download_line(label, key):
              url = downloads.get(key)
              if not url:
                  return None
              return f"- **{label}** [Download]({url})"

          lines = [
              line
              for line in (
                  download_line("Windows", "windows"),
                  download_line("Mac", "macos"),
                  download_line("Linux", "linux"),
              )
              if line
          ]

          plugin_url = downloads.get("plugin")
          if plugin_url:
              lines.append("")
              lines.append(f"**Plugins Roblox** [Download Here]({plugin_url})")

          if not lines:
              fail(
                  "The mirror job reported no download URLs, so the announcement "
                  "would only contain dead links."
              )

          lines.append("")
          lines.append(f"[GitHub release]({release_url})")

          DOWNLOADS = "\n".join(lines)

          def github_api(path, retries=3):
              url = f"https://api.github.com{path}"
              last_error = None

              for attempt in range(retries):
                  request = urllib.request.Request(
                      url,
                      headers={
                          "Accept": "application/vnd.github+json",
                          "Authorization": f"Bearer {github_token}",
                          "X-GitHub-Api-Version": "2022-11-28",
                          "User-Agent": "ValencyStudio - Spoofer-Release-Bot",
                      },
                  )

                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          return json.loads(response.read().decode("utf-8"))
                  except urllib.error.HTTPError as error:
                      body = error.read().decode("utf-8", errors="replace")
                      last_error = RuntimeError(
                          f"GitHub API failed with status {error.code} for {path}: {body}"
                      )

                      if error.code in (429, 500, 502, 503, 504) and attempt < retries - 1:
                          time.sleep(2 ** attempt)
                          continue

                      raise last_error
                  except urllib.error.URLError as error:
                      last_error = RuntimeError(
                          f"GitHub API network error for {path}: {error}"
                      )

                      if attempt < retries - 1:
                          time.sleep(2 ** attempt)
                          continue

                      raise last_error

              raise last_error

          def get_release():
              if not repo or not github_token:
                  return {}

              try:
                  return github_api(f"/repos/{repo}/releases/tags/{release_tag}")
              except Exception:
                  return {}

          release = get_release()
          release_notes = (release.get("body") or "").strip()
          if not release_notes:
              release_notes = "No release notes were provided for this version."

          def get_commit_author():
              fallback = {
                  "name": "GitHub",
                  "url": release_url,
                  "avatar": None,
              }

              if not repo or not github_token:
                  return fallback

              commit = None

              try:
                  commit = github_api(f"/repos/{repo}/commits/{release_tag}")
              except Exception:
                  try:
                      ref = github_api(f"/repos/{repo}/git/ref/tags/{release_tag}")
                      obj = ref.get("object") or {}
                      sha = obj.get("sha")

                      if obj.get("type") == "tag" and sha:
                          tag = github_api(f"/repos/{repo}/git/tags/{sha}")
                          sha = (tag.get("object") or {}).get("sha")

                      if sha:
                          commit = github_api(f"/repos/{repo}/commits/{sha}")
                  except Exception:
                      return fallback

              if not commit:
                  return fallback

              github_author = commit.get("author") or {}
              commit_author = (commit.get("commit") or {}).get("author") or {}

              return {
                  "name": (
                      github_author.get("login")
                      or commit_author.get("name")
                      or "GitHub"
                  ),
                  "url": github_author.get("html_url") or release_url,
                  "avatar": github_author.get("avatar_url"),
              }

          author = get_commit_author()

          def fit_embed_description(text, max_chars=3900):
              if len(text) <= max_chars:
                  return text

              suffix = f"\n\n[Read the full release notes]({release_url})"
              available = max(0, max_chars - len(suffix) - 1)

              clipped = (
                  text[:available].rsplit("\n", 1)[0].rstrip()
                  or text[:available].rstrip()
              )

              return f"{clipped}…{suffix}"

          safe_notes = release_notes.replace("```", "'''")
          changelog = fit_embed_description(safe_notes)

          footer = {
              "text": (
                  f"Released by {author['name']} • "
                  "The auto-updater will prompt you on next launch."
              )
          }

          if author.get("avatar"):
              footer["icon_url"] = author["avatar"]

          allowed_parse = []
          if "@everyone" in mention or "@here" in mention:
              allowed_parse.append("everyone")
          if "<@" in mention:
              allowed_parse.append("users")
          if "<@&" in mention:
              allowed_parse.append("roles")

          payload = {
              "content": f"{mention} **ValencyStudio - Spoofer {release_tag} has updated!**".strip(),
              "embeds": [
                  {
                      "title": "Downloads Available",
                      "description": DOWNLOADS,
                      "color": 4653311,
                      "author": {
                          "name": "ValencyStudio - Spoofer Updates",
                          "icon_url": ICON_URL,
                      },
                      "image": {
                          "url": BANNER_URL,
                      },
                  },
                  {
                      "title": "CHANGELOGS",
                      "description": f"```diff\n{changelog}\n```",
                      "color": 1949277,
                      "footer": footer,
                  },
              ],
              "username": "ValencyStudio App",
              "avatar_url": ICON_URL,
              "allowed_mentions": {
                  "parse": allowed_parse,
              },
          }

          def post_to_discord():
              data = json.dumps(payload).encode("utf-8")
              url = f"https://discord.com/api/v10/channels/{channel_id}/messages"
              last_error = None

              for attempt in range(3):
                  request = urllib.request.Request(
                      url,
                      data=data,
                      headers={
                          "Content-Type": "application/json",
                          "Authorization": f"Bot {bot_token}",
                          "User-Agent": "ValencyStudio - Spoofer-Discord-Release-Bot",
                      },
                      method="POST",
                  )

                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          response.read()
                          return
                  except urllib.error.HTTPError as error:
                      body = error.read().decode("utf-8", errors="replace")
                      last_error = RuntimeError(
                          f"Discord API failed with status {error.code}: {body}"
                      )

                      if error.code == 429:
                          retry_after = 1.0
                          try:
                              retry_after = float(json.loads(body).get("retry_after", 1.0))
                          except Exception:
                              pass

                          time.sleep(min(retry_after + 1.0, 60.0))
                          continue

                      if error.code in (500, 502, 503, 504) and attempt < 2:
                          time.sleep(2 ** attempt)
                          continue

                      raise last_error
                  except urllib.error.URLError as error:
                      last_error = RuntimeError(f"Discord API network error: {error}")

                      if attempt < 2:
                          time.sleep(2 ** attempt)
                          continue

                      raise last_error

              raise last_error

          post_to_discord()
          print(f"Posted Discord release announcement for {release_tag}.")
          PY